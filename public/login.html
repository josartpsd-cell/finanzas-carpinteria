<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Finanzas Carpintería</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Cpath d='M8 23V9h4l4 6 4-6h4v14h-4v-8l-4 6-4-6v8z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: radial-gradient(1200px 600px at 20% 0%, #14332c 0%, #0c1a17 55%, #08110f 100%);
    color: #e7f2ee; font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  }
  .card {
    width: 100%; max-width: 380px; background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.09); border-radius: 18px; padding: 28px 26px;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,.8); backdrop-filter: blur(8px);
  }
  .mark {
    width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center;
    background: linear-gradient(145deg, #14b8a6, #0f766e); color: #fff; font-weight: 800; font-size: 21px;
    box-shadow: 0 10px 24px -10px rgba(20,184,166,.9); margin-bottom: 18px;
  }
  h1 { margin: 0 0 4px; font-size: 19px; letter-spacing: -.01em; }
  p.sub { margin: 0 0 22px; font-size: 12.5px; color: #8fb0a7; }
  label { display: block; font-size: 11.5px; font-weight: 600; color: #a9c1ba; margin-bottom: 6px; }
  input {
    width: 100%; font: inherit; font-size: 14px; color: #fff; padding: 11px 13px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); border-radius: 10px;
  }
  input:focus { outline: none; border-color: #14b8a6; box-shadow: 0 0 0 3px rgba(20,184,166,.18); }
  button {
    width: 100%; margin-top: 16px; font: inherit; font-size: 14px; font-weight: 650; cursor: pointer;
    padding: 11px 14px; border: 0; border-radius: 10px; color: #06231f;
    background: linear-gradient(180deg, #2dd4bf, #14b8a6);
    transition: filter .15s, transform .08s;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .6; cursor: default; }
  .erro {
    margin-top: 14px; font-size: 12.5px; color: #fecaca; background: rgba(180,35,24,.22);
    border: 1px solid rgba(248,113,113,.3); border-radius: 9px; padding: 9px 11px; display: none;
  }
  .erro.on { display: block; }
  .pe { margin: 22px 0 0; font-size: 11px; color: #5d7a72; text-align: center; }
</style>
</head>
<body>
  <form class="card" id="form">
    <div class="mark">M</div>
    <h1>Finanzas — Carpintería</h1>
    <p class="sub">Ingresa la contraseña para ver las cuentas.</p>
    <label for="senha">Contraseña</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required autofocus>
    <button type="submit" id="btn">Entrar</button>
    <div class="erro" id="erro"></div>
    <p class="pe">Datos guardados en el servidor de la carpintería</p>
  </form>
<script>
  const form = document.getElementById('form');
  const erro = document.getElementById('erro');
  const btn = document.getElementById('btn');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    erro.classList.remove('on');
    btn.disabled = true;
    btn.textContent = 'Entrando…';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ senha: document.getElementById('senha').value }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.erro || 'No se pudo entrar');
      location.replace('/');
    } catch (err) {
      erro.textContent = err.message;
      erro.classList.add('on');
      btn.disabled = false;
      btn.textContent = 'Entrar';
      document.getElementById('senha').select();
    }
  });
</script>
</body>
</html>
